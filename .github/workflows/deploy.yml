name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Show site URL
        run: |
          {
            echo "## Publishing Portal site"
            echo ""
            echo "After enabling GitHub Pages (Settings → Pages → Deploy from a branch → \`gh-pages\` / root), open:"
            echo ""
            echo "### https://zainulhassan55.github.io/publishing_portal/"
            echo ""
            echo "Deploy branch: \`gh-pages\`"
          } >> "$GITHUB_STEP_SUMMARY"
