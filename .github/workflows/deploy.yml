#
# Production deploy.
#
# Replaces a GitHub Pages workflow left over from the Vite single-page app,
# which built `./dist` with `VITE_OJS_URL` and published to Pages. None of that
# applies to the Next.js portal: it is a standalone Node server behind nginx on
# the VPS, deployed by scripts/deploy.sh, and it has to run on the same origin
# as OJS for the integration to work at all.
#
# Tag-triggered, because scripts/deploy.sh refuses an untagged production
# deploy — a release must be reproducible from a tag, not from a branch tip.
#
name: Deploy portal

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: staging
        type: choice
        options: [staging, production]

# Never let two deploys interleave: they would race on the release symlink.
concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # deploy.sh runs `git describe --exact-match --tags HEAD`, which needs
          # the tags, and names the release from the short SHA.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # deploy.sh does the rest: verify, harvest, build, upload to a new
      # timestamped release, flip the symlink, health-gate, roll back on
      # failure. Duplicating any of that here would let the two drift.
      - name: Deploy
        run: ./scripts/deploy.sh "${{ inputs.target || 'production' }}"
        env:
          DEPLOY_STAGING_HOST: ${{ secrets.DEPLOY_STAGING_HOST }}
          DEPLOY_PRODUCTION_HOST: ${{ secrets.DEPLOY_PRODUCTION_HOST }}
          NEXT_PUBLIC_SITE_URL: https://www.nextgeniqpress.com
          # Harvest reads these. Without the key the snapshot falls back to
          # OAI-PMH fidelity and the deploy still completes.
          OJS_BASE_URL: ${{ vars.OJS_BASE_URL }}
          OJS_API_KEY: ${{ secrets.OJS_API_KEY }}
          # Production never serves the fixture articles. See
          # src/data/content/index.ts.
          NEXT_PUBLIC_DEMO_CONTENT: '0'
          # The sign-in page is statically prerendered, so this flag is read
          # at BUILD time — setting it only in the server's .env changes the
          # runtime API route but not the already-built page. It must be on
          # in both places. The server .env copy still gates the credential
          # endpoint itself.
          PORTAL_NATIVE_SIGNIN: '1'
