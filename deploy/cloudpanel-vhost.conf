#
# CloudPanel Vhost for www.nextgeniqpress.com — portal + OJS on one origin.
#
# Paste this into CloudPanel → Sites → www.nextgeniqpress.com → Vhost.
#
# This is the EXISTING CloudPanel vhost with the portal merged in. The
# double-brace tokens are CloudPanel's own and must be left exactly as they
# are — CloudPanel substitutes them when it writes the real file. Do not
# replace them with literal paths.
#
# ---------------------------------------------------------------------------
# What changed from the original, and why
# ---------------------------------------------------------------------------
#
# The stack here is: nginx(443) → Varnish → nginx(8080) → PHP-FPM(TCP). OJS
# keeps that whole path untouched. The portal is added *beside* it, and
# deliberately bypasses Varnish.
#
# 1. `location /` now proxies to the portal on 127.0.0.1:3000 instead of
#    Varnish. This is what replaces the old Vite site with the new portal.
#
#    The portal bypasses Varnish on purpose. Next.js already emits correct
#    Cache-Control per route — immutable for hashed assets, `no-store` for
#    session and form endpoints. A shared cache in front of it would serve
#    stale HTML and, worse, could hand one signed-in reader's response to
#    somebody else.
#
# 2. `location ^~ /_next/` is new, and the `^~` matters. nginx gives prefix
#    matches marked `^~` priority over regex locations, so without it the
#    `~* \.(css|js|…)$` block below would capture every bundle, find no file on
#    disk, and return 404 — the page would render and then be completely dead,
#    because none of its JavaScript loaded.
#
# 3. The static-asset regex now ends with `try_files $uri @portal`. OJS theme
#    assets still come off disk exactly as before; anything not on disk (the
#    portal's own files under /public) falls through to the portal instead of
#    404ing.
#
# 4. `location ^~ /ojs/index.php/` is UNCHANGED and still goes to Varnish.
#    It is declared before `location /` so OJS can never fall through to the
#    portal.
#
# 5. `/api/health` is excluded from the access log; a monitor hitting it every
#    minute would otherwise bury real traffic.
#
# Same-origin is load-bearing. Do not move OJS to a subdomain — see
# docs/OJS-INTEGRATION.md.
#

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name nextgeniqpress.com;
  return 301 https://www.nextgeniqpress.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.nextgeniqpress.com www1.nextgeniqpress.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Manuscripts, config and admin tooling must never be served as files.
  #
  # This is a REGEX location, so it is only consulted for paths that did not
  # already match a `^~` prefix location. That is why the catch-all OJS block
  # below uses a plain `location /ojs` rather than `^~ /ojs`: `^~` suppresses
  # regex evaluation entirely, which would have made config.inc.php publicly
  # readable. Keep this block ahead of the static-asset regex.
  location ~ ^/ojs/(config\.inc\.php|cache/|dbscripts/|tools/) {
    deny all;
  }

  # ---------------------------------------------------------------------
  # OJS — declared before `location /` so it never falls through to the
  # portal. Both blocks go to Varnish, exactly as before.
  # ---------------------------------------------------------------------
  location ^~ /ojs/index.php/ {
    # The portal owns the public journal pages, so OJS's own versions of them
    # are redundant — and they are where readers kept landing back in the old
    # interface. OJS links to them from places a theme cannot reach: the
    # editorial backend header is a Vue application, not a template, so its
    # journal-name link cannot be re-pointed in code. Redirecting here catches
    # every route to those pages at once, including old bookmarks and anything
    # already indexed by a search engine.
    #
    # ONLY the bare journal index is redirected. Every deeper OJS path — issues,
    # articles, login, the submission wizard, the editorial backend, the REST
    # API and OAI — has more path after the slug and is untouched, which is what
    # keeps the editorial system and the portal's server-to-server calls working.
    # `/index` is matched as well as the bare slug: OJS writes a journal's home
    # link both ways, and the editorial backend uses the explicit
    # /ojs/index.php/<journal>/index form.
    if ($request_uri ~ "^/ojs/index\.php/index(/index)?/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals;
    }
    if ($request_uri ~ "^/ojs/index\.php/([a-z0-9]+)(/index)?/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1;
    }

    # A journal's OJS login form goes to the portal's sign-in instead. This is
    # where OJS lands a reader after logging out, which otherwise drops them
    # straight back into the old interface at the one moment they are most
    # likely to sign in again.
    #
    # 302, not 301: a permanent redirect on a login URL is cached by the
    # browser and would be miserable to undo.
    #
    # The journals are listed explicitly to protect ONE url. The portal signs
    # people in by driving OJS's own login form server-side — GET the form for
    # a CSRF token, POST the credentials (see src/lib/auth/ojs-login.ts) — and
    # it uses the site-level context, /ojs/index.php/index/login. Redirecting
    # that would break sign-in everywhere, portal included, and leave no way
    # back in. It must keep reaching OJS, so it is not in this list.
    #
    # Anchored before /login ends: /login/signIn and /login/lostPassword carry
    # more path, do not match, and keep working. Password reset stays in OJS,
    # which owns accounts.
    if ($request_uri ~ "^/ojs/index\.php/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/login/?(\?.*)?$") {
      return 302 https://www.nextgeniqpress.com/sign-in;
    }

    # -------------------------------------------------------------------
    # The rest of OJS's public journal pages, every one of which the portal
    # already serves. These are reachable from OJS's own journal navigation
    # (Current / Archives / About), so a reader who lands anywhere in OJS can
    # walk the whole old site from there.
    #
    # They are also the SEO half of the problem, and the more expensive half.
    # Each pair is the same content on two URLs, which splits ranking between
    # them and lets a search engine send readers to the interface this rebuild
    # exists to replace. A 301 is the strongest available signal that the
    # portal URL is the real one, so it fixes the reader's journey and the
    # indexing in a single rule.
    #
    # Where the destination carries the journal, the ten are listed explicitly:
    # a generic pattern would also match the site-level `index` context and
    # rewrite it to the non-existent /journals/index. Where the destination is
    # the same for every journal, [a-z0-9]+ is correct and covers `index` too.
    #
    # Each pattern is anchored at both ends, so deeper paths never match and
    # order carries no meaning. Verified: every destination below returns 200.
    # -------------------------------------------------------------------
    if ($request_uri ~ "^/ojs/index\.php/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/about/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1;
    }
    if ($request_uri ~ "^/ojs/index\.php/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/about/editorialMasthead/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1/editorial-board;
    }
    if ($request_uri ~ "^/ojs/index\.php/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/issue/current/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1/current-issue;
    }
    if ($request_uri ~ "^/ojs/index\.php/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/issue/archive/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1/issues;
    }
    if ($request_uri ~ "^/ojs/index\.php/[a-z0-9]+/about/submissions/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/authors;
    }
    if ($request_uri ~ "^/ojs/index\.php/[a-z0-9]+/about/contact/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/contact;
    }
    if ($request_uri ~ "^/ojs/index\.php/[a-z0-9]+/about/privacy/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/policies/privacy;
    }
    if ($request_uri ~ "^/ojs/index\.php/[a-z0-9]+/announcement/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/news;
    }
    if ($request_uri ~ "^/ojs/index\.php/[a-z0-9]+/search/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/search;
    }

    # DELIBERATELY NOT REDIRECTED, and each for its own reason:
    #
    #   /article/...      Article and galley pages. OJS keys them by internal
    #                     submission id and the portal keys them by DOI, so
    #                     nginx has nothing to map one to the other with — a
    #                     redirect would need a lookup it cannot do. Revisit
    #                     when the first article publishes and decide then
    #                     which URL is canonical; today there are none.
    #   /user/register    Registration, and /login/lostPassword. OJS owns
    #                     accounts; the portal has no equivalent page.
    #   /index/login      The form the portal's own sign-in drives
    #                     server-side. See the note above.
    #   /oai, /api/v1     Machine endpoints. Indexing services and the
    #                     portal's harvest both depend on them.
    #   everything else   The editorial system itself.

    # Straight to nginx:8080, NOT through Varnish. This was {{varnish_proxy_pass}}
    # and it was breaking every signed-in session in OJS.
    #
    # The Varnish config on this box is CloudPanel's stock WordPress one, and it
    # is actively hostile to OJS. Measured on the live server:
    #
    #   through Varnish (6081): no Set-Cookie header at all
    #   direct to nginx (8080): Set-Cookie: OJSSID=...; path=/ojs/; ...
    #
    # Two rules in /etc/varnish/default.vcl cause it. `vcl_backend_response`
    # does `unset beresp.http.set-cookie` on any cacheable GET, which destroys
    # the session cookie OJS is trying to issue. And `vcl_recv` only bypasses
    # the cache for a cookie named `wordpress_logged_in_`, so a request
    # carrying OJSSID is still served whatever anonymous copy is in the cache —
    # which is how a signed-in author gets handed the login page.
    #
    # Caching OJS was never right: it is session-bearing and dynamic on every
    # route, and PKP does not support a shared cache in front of it without a
    # VCL written for OJS. Fixing the VCL needs root, which the site user does
    # not have; bypassing it is one line here and loses nothing. The portal
    # already bypasses Varnish for the same reason (see note 1 at the top).
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
    # OJS sets no HSTS of its own. The portal gets this from next.config.ts.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # Everything else under /ojs — including the bare `/ojs/` journal homepage,
  # `/ojs/public/...` uploads and the theme's own files.
  #
  # REQUIRED, and its absence was a bug: in the original vhost these URLs fell
  # through to `location /`, which went to Varnish and so reached OJS anyway.
  # Now that `location /` is the portal, without this block
  # `https://www.nextgeniqpress.com/ojs/` would hit the portal and 404 — the
  # journal homepage would simply stop working.
  #
  # Plain prefix, not `^~`, so the deny regex above still applies.
  location /ojs {
    # The same journal-homepage redirect as the block above, for the
    # `restful_urls` form OJS also answers on: /ojs/<journal> with no
    # index.php. Both spellings reach the same page, so both must redirect or
    # readers keep finding their way back into the old interface.
    #
    # Journals are listed explicitly rather than matched as [a-z0-9]+ because
    # this location also serves real directories — /ojs/public, /ojs/plugins,
    # /ojs/styles — and a generic pattern would redirect those into nowhere.
    # ADD A NEW JOURNAL'S SLUG HERE when one is created in OJS; the list is
    # the same ten in src/data/registry.ts.
    if ($request_uri ~ "^/ojs/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)(/index)?/?(\?.*)?$") {
      return 301 https://www.nextgeniqpress.com/journals/$1;
    }

    # The restful_urls spelling of the journal login form; see the note in the
    # block above for why /ojs/index/login is deliberately absent.
    if ($request_uri ~ "^/ojs/(ijdh|ijdm|ijds|ijei|ijic|ijis|ijmc|ijmr|ijqt|ijse)/login/?(\?.*)?$") {
      return 302 https://www.nextgeniqpress.com/sign-in;
    }

    # Direct to nginx:8080 rather than Varnish, for the reason documented in
    # the block above: the stock VCL strips Set-Cookie and serves cached
    # anonymous pages to signed-in readers.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }

  # ---------------------------------------------------------------------
  # Portal build assets.
  #
  # `^~` is required: it outranks the `~* \.(css|js|…)$` regex further down,
  # which would otherwise try to serve these from disk and 404 every bundle.
  # Filenames are content-hashed, so a new release never reuses a URL and
  # `immutable` is safe.
  # ---------------------------------------------------------------------
  location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header alt-svc 'h3=":443"; ma=86400';
    # Repeated because a location with its own add_header does not inherit the
    # server-level ones.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    access_log off;
  }

  # Everything else Next.js owns under /_next (image optimiser, RSC payloads).
  # Not cached here — Next.js sets its own policy per response.
  location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  # Health probe for the deploy gate and uptime monitoring. Kept out of the
  # access log so a once-a-minute monitor does not bury real traffic.
  location = /api/health {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # ---------------------------------------------------------------------
  # Portal — replaces the old Vite site that was served from htdocs.
  # Direct to Node, bypassing Varnish (see note 1 at the top).
  # ---------------------------------------------------------------------
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_redirect off;
    proxy_read_timeout 60s;
  }

  # OJS theme assets keep being served from disk exactly as before. The
  # `try_files` fallback is new: anything NOT on disk — the portal's own files
  # under /public — reaches the portal instead of returning 404.
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    # Repeated because a location with its own add_header does not inherit the
    # server-level ones.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    expires max;
    access_log off;
    try_files $uri @portal;
  }

  location @portal {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }
}

#
# nginx on 8080, behind Varnish. Serves OJS: static files from disk, PHP over
# TCP to FPM. COMPLETELY UNCHANGED from the original vhost — the portal is not
# behind Varnish and so has no business in this block.
#
server {
  listen 8080;
  listen [::]:8080;
  server_name www.nextgeniqpress.com www1.nextgeniqpress.com;
  {{root}}

  include /etc/nginx/global_settings;

  try_files $uri $uri/ /index.html;
  index index.php index.html;

  location ~ ^/ojs/(config\.inc\.php|cache/|dbscripts/|tools/) {
    deny all;
  }

  location ~ ^/ojs/.+\.php(/|$) {
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    set $path_info $fastcgi_path_info;
    fastcgi_param PATH_INFO $path_info;
    try_files $fastcgi_script_name =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  location /ojs/ {
    try_files $uri $uri/ /ojs/index.php?$args;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  if (-f $request_filename) {
    break;
  }
}
