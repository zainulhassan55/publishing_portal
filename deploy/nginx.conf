# nginx vhost for www.nextgeniqpress.com
#
# The portal and OJS share one origin: the portal at /, OJS at /ojs. That is
# what makes the OJS session cookie usable for portal API calls — see
# docs/OJS-INTEGRATION.md. Moving OJS to a subdomain breaks the auth design.

upstream ngiq_portal {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nextgeniqpress.com nextgeniqpress.com;
    return 301 https://www.nextgeniqpress.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nextgeniqpress.com;
    ssl_certificate     /etc/letsencrypt/live/nextgeniqpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextgeniqpress.com/privkey.pem;
    # One canonical host, so a page is never indexed at two addresses.
    return 301 https://www.nextgeniqpress.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nextgeniqpress.com;

    ssl_certificate     /etc/letsencrypt/live/nextgeniqpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextgeniqpress.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Audit F-21. The portal also sets these in next.config.ts; OJS does not,
    # so they are set here for everything under /ojs as well.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64m;   # manuscript and figure uploads go to OJS
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ngiq-access.log;
    error_log  /var/log/nginx/ngiq-error.log;

    # ---------------------------------------------------------------------
    # OJS — matched first so /ojs never falls through to the portal
    # ---------------------------------------------------------------------
    location ^~ /ojs {
        alias /home/nextgeniq/ojs;
        index index.php;
        try_files $uri $uri/ @ojs_index;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.2-fpm-ojs.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 300;
        }

        # OJS keeps submission files outside the web root; if any ever land
        # inside it, they must not be servable directly.
        location ~ ^/ojs/files/ { deny all; }
        location ~ /\.       { deny all; }
    }

    location @ojs_index {
        rewrite ^/ojs(/.*)?$ /ojs/index.php$1 last;
    }

    # ---------------------------------------------------------------------
    # Portal
    # ---------------------------------------------------------------------

    # Hashed build assets are immutable; a new release has new filenames.
    location /_next/static/ {
        proxy_pass http://ngiq_portal;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://ngiq_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Health probe for the deploy gate and uptime monitoring. Never cached, and
    # kept out of the access log so it does not drown real traffic.
    location = /api/health {
        proxy_pass http://ngiq_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
